# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: test_develop

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --dev

      - name: Lint with ruff check
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uv run ruff check . --select=E9,F63,F7,F82
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          uv run ruff check . --exit-zero --config "lint.mccabe.max-complexity = 10" --config "line-length = 127" --statistics

      - name: Format code with ruff format
        run: |
          uv run black --check .

      - name: Test with pytest
        run: |
          uv run pytest --cov=pitchtypes --cov-report=xml --cov-report=html --junitxml=junit/test-results.xml
